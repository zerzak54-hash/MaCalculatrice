
<!DOCTYPE html>
<html lang="fr">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2563eb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma Calculatrice+</title>
<style>
:root {
  font-family: "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #edf1f8;
  color: #172033;
  padding: 20px;
}
.app {
  width: min(100%, 390px);
  padding: 22px;
  border-radius: 24px;
  background: white;
  box-shadow: 0 12px 40px #26365320;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
h1 { font-size: 22px; margin: 0 0 16px; }
button {
  border: 0;
  cursor: pointer;
  border-radius: 12px;
  font: inherit;
  font-size: 18px;
  min-height: 54px;
  background: #edf1f8;
  color: inherit;
}
button:hover { filter: brightness(.95); }
#screen {
  width: 100%;
  padding: 18px 12px;
  margin: 8px 0 14px;
  border: 1px solid #dce2ed;
  border-radius: 14px;
  font-size: 30px;
  text-align: right;
  background: #f8faff;
  color: #172033;
}
.keys {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
}
.op { background: #dce8ff; color: #174bb5; }
.clear { background: #ffe4e4; color: #a32424; }
.equal { background: #2563eb; color: white; }
.wide { grid-column: span 2; }
.tools {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.tools button { flex: 1; font-size: 14px; }
h2 { font-size: 16px; margin: 22px 0 8px; }
#history {
  font-size: 13px;
  color: #596579;
  overflow-wrap: anywhere;
}
.history-item { padding: 5px 0; border-bottom: 1px solid #eee; }
body.dark { background: #141923; color: #f1f5f9; }
.dark .app { background: #222a38; }
.dark button { background: #343e50; color: white; }
.dark .op { background: #344c78; }
.dark .clear { background: #713737; }
.dark .equal { background: #2563eb; }
.dark #screen { background: #161d29; color: white; border-color: #465064; }
.dark #history { color: #c5cede; }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>🧮 Ma Calculatrice+</h1>
    <button id="theme" aria-label="Changer de thème"
      style="min-height:40px;width:44px">☾</button>
  </header>

  <input id="screen" value="0" readonly
    aria-label="Résultat du calcul">

  <div class="keys">
    <button class="clear" data-action="clear">AC</button>
    <button data-action="delete">⌫</button>
    <button class="op" data-action="percent">%</button>
    <button class="op" data-value="/">÷</button>

    <button data-value="7">7</button>
    <button data-value="8">8</button>
    <button data-value="9">9</button>
    <button class="op" data-value="*">×</button>

    <button data-value="4">4</button>
    <button data-value="5">5</button>
    <button data-value="6">6</button>
    <button class="op" data-value="-">−</button>

    <button data-value="1">1</button>
    <button data-value="2">2</button>
    <button data-value="3">3</button>
    <button class="op" data-value="+">+</button>

    <button class="wide" data-value="0">0</button>
    <button data-value=".">,</button>
    <button class="equal" data-action="equals">=</button>
  </div>

  <div class="tools">
    <button data-action="copy">Copier le résultat</button>
    <button data-action="history-clear">Effacer l'historique</button>
  </div>

  <h2>Historique</h2>
  <div id="history">Tes calculs apparaîtront ici.</div>
</main>

<script>
const screen = document.querySelector("#screen");
const historyBox = document.querySelector("#history");
let expression = "";
let finished = false;
let history = [];

function show() {
  screen.value = expression || "0";
}

function addHistory(text) {
  history.unshift(text);
  history = history.slice(0, 10);
  historyBox.replaceChildren();
  history.forEach(item => {
    const line = document.createElement("div");
    line.className = "history-item";
    line.textContent = item;
    historyBox.appendChild(line);
  });
}

function calculate() {
  const s = expression;
  if (!s || !/^[0-9.+*/() -]+$/.test(s)) return;

  try {
    const result = Function('"use strict"; return (' + s + ')')();
    if (typeof result !== "number" || !Number.isFinite(result)) {
      throw new Error("Calcul impossible");
    }
    const rounded = Number(result.toPrecision(12));
    addHistory(s.replaceAll("*", "×").replaceAll("/", "÷")
      + " = " + rounded);
    expression = String(rounded);
    finished = true;
    show();
  } catch {
    screen.value = "Calcul impossible";
    expression = "";
    finished = false;
  }
}

document.querySelector(".keys").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;

  const value = btn.dataset.value;
  const action = btn.dataset.action;

  if (action === "clear") {
    expression = "";
    finished = false;
    show();
    return;
  }
  if (action === "delete") {
    expression = expression.slice(0, -1);
    finished = false;
    show();
    return;
  }
  if (action === "equals") {
    calculate();
    return;
  }
  if (action === "percent") {
    const match = expression.match(/(\d*\.?\d+)$/);
    if (match) {
      const start = match.index;
      const number = Number(match[0]) / 100;
      expression = expression.slice(0, start) + number;
      show();
    }
    return;
  }
  if (value !== undefined) {
    if (finished && /[0-9.]/.test(value)) expression = "";
    finished = false;
    if (value === "." && /(?:^|[+\-*/])\d*\.\d*$/.test(expression)) return;
    expression += value;
    show();
  }
});

document.querySelector("#theme").addEventListener("click", () => {
  document.body.classList.toggle("dark");
});

document.querySelector('[data-action="copy"]').addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(screen.value);
  } catch {
    screen.select?.();
  }
});

document.querySelector('[data-action="history-clear"]').addEventListener("click", () => {
  history = [];
  historyBox.textContent = "Tes calculs apparaîtront ici.";
});

document.addEventListener("keydown", e => {
  if (/^[0-9.+*/()-]$/.test(e.key)) {
    expression += e.key;
    finished = false;
    show();
  } else if (e.key === "Enter") {
    calculate();
  } else if (e.key === "Backspace") {
    expression = expression.slice(0, -1);
    show();
  } else if (e.key === "Escape") {
    expression = "";
    show();
  }
});
</script>
</body>
</html>
